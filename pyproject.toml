[project]
name = "ingrain-server"
version = "0.2.4"
description = "Dev tools for Repo"
readme = "README.md"
dependencies = [
    "ingrain>=0.2.3",
]

[dependency-groups]
dev = [
    "ftfy>=6.3.1",
    "certifi>=2025.11.12",
    "fastapi==0.124.2",
    "hf-transfer==0.1.9",
    "onnx==1.20.0",
    "onnxconverter-common>=1.16.0",
    "onnxoptimizer>=0.3.13",
    "onnxscript>=0.5.6",
    "open-clip-torch==3.2.0",
    "orjson==3.11.5",
    "pillow==12.0.0",
    "pycurl==7.45.7",
    "pydantic==2.12.5",
    "sentence-transformers==5.2.0",
    "timm==1.0.22",
    "tokenizers==0.22.1",
    "torch==2.9.1+cpu ; platform_machine == 'x86_64'",
    "torch==2.9.1 ; platform_machine == 'aarch64'",
    "torchvision==0.24.1+cpu ; platform_machine == 'x86_64'",
    "torchvision==0.24.1 ; platform_machine == 'aarch64'",
    "transformers==4.57.3",
    "tritonclient[grpc]>=2.63.0",
    "uvicorn==0.38.0",
    "validators==0.35.0",
    "huggingface_hub[hf_xet]>=0.36.0",
    "pytest>=9.0.2",
    "black>=25.12.0",
    "ruff>=0.14.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]
