[project]
name = "ingrain-model-server"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.10.5",
    "fastapi==0.119.1",
    "hf-transfer==0.1.9",
    "onnx==1.19.1",
    "onnxconverter-common>=1.16.0",
    "onnxoptimizer>=0.3.13",
    "onnxscript>=0.5.4",
    "open-clip-torch==3.2.0",
    "orjson==3.11.3",
    "pillow==12.0.0",
    "pycurl==7.45.7",
    "pydantic==2.12.3",
    "sentence-transformers==5.1.1",
    "timm==1.0.20",
    "tokenizers==0.22.1",
    "torch==2.9.0+cpu ; platform_machine == 'x86_64'",
    "torch==2.9.0 ; platform_machine == 'aarch64'",
    "torchvision==0.24.0+cpu ; platform_machine == 'x86_64'",
    "torchvision==0.24.0 ; platform_machine == 'aarch64'",
    "transformers==4.57.1",
    "tritonclient[grpc]>=2.59.0",
    "uvicorn==0.38.0",
    "validators==0.35.0",
    "huggingface_hub[hf_xet]>=0.33.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]